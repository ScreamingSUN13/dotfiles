[widget.audio_visualizer]
bands = 20
centered = false
color_1 = "secondary"
color_2 = "secondary"
mirrored = false
width = 102

[widget.clock]
anchor = true
format = "{:%-I:%M %p | %a, %b %d, %Y}"

[widget.control-center]
glyph = "menu-2"

[widget.cpu]
glyph = "cpu"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"
custom_image_colorize = true
icon_color = "secondary"
scale = 1.1500000000000001

[widget.media]
art_size = 96
hide_when_no_media = true
max_length = 242
title_scroll = "on_hover"

[widget.sysmon]
glyph = "device-gamepad"
stat = "gpu_usage"
