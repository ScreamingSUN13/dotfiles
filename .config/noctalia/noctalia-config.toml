[bar.default]
background_opacity = 0.3899999912828207
border = "on_primary"
capsule = true
capsule_fill = "on_primary"
capsule_opacity = 0.7799999825656414
capsule_radius = 9
color = "secondary"
contact_shadow = true
end = [ "group:g2", "tray", "volume", "battery", "notifications", "control-center", "session" ]
font_family = "JetBrains Mono"
font_weight = 600
icon_color = "primary"
margin_ends = 0
radius = 43
radius_bottom_left = 80
radius_bottom_right = 80
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "workspaces", "active_window", "media", "audio_visualizer" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "on_primary"
    id = "g2"
    members = [ "cpu", "sysmon", "ram" ]
    opacity = 0.77999997138977051
    padding = 6.0
    radius = 9.0

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
