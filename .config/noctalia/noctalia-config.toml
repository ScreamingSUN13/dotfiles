    [wallpaper.monitors.DP-3]
    path = "/home/stephenk/Pictures/Wallpapers/OuterWildsSolarSystem.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/stephenk/Pictures/Wallpapers/OneShot.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/stephenk/Pictures/Wallpapers/OuterWildsMain.jpg"

