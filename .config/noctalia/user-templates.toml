[templates.niri]
input_path = "~/.config/noctalia/templates/niri.kdl"
output_path = "~/.config/niri/colors.kdl"
post_hook = "niri msg action reload-config"

[templates.nvim-base16]
input_path = "~/.config/nvim/lua/matugen-template.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = 'pkill -SIGUSR1 nvim'

[templates.ohmyposh]
input_path = "~/.config/oh-my-posh/noctalia-template.json"
output_path = "~/.config/oh-my-posh/noctalia.json"
post_hook = 'pkill -SIGUSR1 fish'

[templates.background]
input_path = "~/.config/niri/configTemplate.kdl"
output_path = "~/.config/niri/config.kdl"
post_hook = "niri msg action reload-config"

[templates.fastfetch]
input_path = "~/.config/fastfetch/configTemplate.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.atuin]
input_path = "~/.config/atuin/themes/template.toml"
output_path = "~/.config/atuin/themes/noctalia.toml"
