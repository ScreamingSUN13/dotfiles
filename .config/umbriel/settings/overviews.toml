# ==============================================================================
# Overview
# Built-in overview and animation values are used. The top-left hot corner opens
# the overview after a short delay.
# Overview: https://docs.noctalia.dev/umbriel/workspaces-overview/
# Animation: https://docs.noctalia.dev/umbriel/animation/
# [hot_corners.top_left]
# enabled = true
# delay_ms = 500
# action = "overview-open"

# Window-rule opacity and blur fade on focus changes by default. Disable this
# independently of border fades, or choose its own duration and curve.
# [animation.windows_opacity]
# enabled = true
# curve = "spring:1,900"
# duration_ms = 250 # For non-spring curves; a spring sets its own length.

[include]
files = [
	"/usr/share/umbriel/effects/animation/workspace_wipe/effect.toml",
	"/usr/share/umbriel/effects/animation/reveal/effect.toml",
	"/usr/share/umbriel/effects/animation/squash/effect.toml"
]

# Optional live workspace reveal (see docs/user/animation.md).
# Add the bundled effects/animation/workspace_wipe/effect.toml to your includes.

[animation.beziers]
myBezier = [0.05, 0.9, 0.1, 1.05]

[animation.springs]
myBounce = { damping = 0.7, stiffness = 400 }
myBounce2 = { damping = 1, stiffness = 150 }

[animation.workspaces]
style = "slide"          # Default: "slide"
effect = "workspace_wipe"
curve = "myBounce"

# Shade over a window while a modal dialog is attached to it.
# [animation.dialogs]
# dim = 0.3

# Darken the output below a launcher while it is visible:
# [[layer_rule]]
# match.namespace = "^vicinae$"
# dim_behind = 0.5
# Window rules accept dim_behind too; see docs/user/window-rules.md.

[animation]
enabled = true
curve = "myBounce"

[animation.windows_in]
enabled = true
curve = "myBounce2"
scale = 0.5

[animation.windows_out]
enabled = true
curve = "myBounce2"
scale = 0.8

[animation.windows_move]
enabled = true
curve = "myBounce2"

[animation.windows_resize]
enabled = true
curve = "myBounce"

[animation.windows_opacity]
enabled = true
curve = "myBounce"

[animation.overview]
enabled = true
curve = "myBounce"
workspace_curve = "myBounce"

[animation.scratchpad]
enabled = true
curve = "myBounce"
dim = 0.8
blur = false

[animation.dialogs]
enabled = true
dim = 0.3

[animation.border]
enabled = true
curve = "myBounce"

[animation.dim_unfocused]
enabled = false
dim = 0.0

[animation.layers]
enabled = false
